[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audioforge"
version = "3.0.0"
description = "Deterministic audio-asset generation engine — compiles the .af DSL to reproducible WAV + manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva" }]
keywords = ["audio", "dsp", "synthesis", "deterministic", "dsl", "sampler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "lark>=1.1",
    "matplotlib>=3.8",
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "hypothesis>=6.0",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
audioforge = "audioforge.cli:main"

[project.urls]
Homepage = "https://github.com/pedroanisio/audioforge"

[tool.setuptools.packages.find]
include = ["audioforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["audioforge"]

[tool.coverage.report]
fail_under = 90.1
precision = 2
show_missing = true
