[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audioforge"
version = "2.14.0"
description = "Deterministic audio-asset generation engine — compiles the .af DSL to reproducible WAV + manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva" }]
keywords = ["audio", "dsp", "synthesis", "deterministic", "dsl", "sampler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
audioforge = "audioforge.cli:main"

[project.urls]
Homepage = "https://github.com/pedroanisio/audioforge"

[tool.setuptools.packages.find]
include = ["audioforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
