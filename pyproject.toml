[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audioforge"
version = "3.3.0"
description = "Deterministic audio-asset generation engine — compiles the .af DSL to reproducible WAV + manifests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva" }]
keywords = ["audio", "dsp", "synthesis", "deterministic", "dsl", "sampler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "lark>=1.1",
    "matplotlib>=3.8",
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.0",
    "hypothesis>=6.0",
    "pytest>=7.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]
# External oracles for the notation surface (ADR-0011): never a runtime dependency.
# `make oracle-check` skips loudly when they are absent.
# music21 10.x needs Python >= 3.11; on 3.10 the extra installs the other two (floor stays 3.10).
oracles = [
    "music21==10.5.0; python_version >= '3.11'",
    "lilypond==2.25.12",
    "xmlschema==4.3.2",
]
engrave = [
    "lilypond==2.25.12",
]

[project.scripts]
audioforge = "audioforge.cli:main"

[project.urls]
Homepage = "https://github.com/pedroanisio/audioforge"

[tool.setuptools.packages.find]
include = ["audioforge*"]

# Runtime data the wheel must carry: every render compiles the C kernels on
# demand (ADR-0012), and the shipped samples/IRs resolve from the package.
# tests/test_packaging.py fails if a file under audioforge/ is not covered here.
[tool.setuptools.package-data]
audioforge = ["native/*.c", "data/samples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["audioforge"]

[tool.coverage.report]
fail_under = 90.1
precision = 2
show_missing = true
