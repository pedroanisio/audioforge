name: ci

# AF-R01: CI runs the exact composed gate a developer runs locally (`make check`).
# tests/test_ci_make_check_sync.py asserts this workflow invokes `make check`, so
# CI can never silently diverge from the local gate by hand-mirroring a target list.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: python -m pip install -e ".[dev]" uv   # uv: make lock-check enforces uv.lock remotely (RM-B-004)

      - name: Run the gate
        run: make check

  # ADR-0009 / roadmap-notation RN-O-004: the notation surface is judged by external
  # oracles (MusicXML 3.1 XSD, music21, LilyPond). `make oracle-check` skips loudly when
  # the extra is absent; here it must run, so the job installs the extra explicitly.
  oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev and oracle extras
        run: python -m pip install -e ".[dev,oracles]"

      - name: Run the oracle gate
        run: make oracle-check
