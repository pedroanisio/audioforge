="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#66707C">WAV + manifest, sha-256 verified</text><line x1="328.00" y1="243.00" x2="370.00" y2="243.00" stroke="#66707C" stroke-width="1.6" stroke-linecap="butt"/><path d="M376.00,243.00 L370.80,246.00 L370.80,240.00 Z" fill="#66707C"/><line x1="624.00" y1="243.00" x2="666.00" y2="243.00" stroke="#66707C" stroke-width="1.6" stroke-linecap="butt"/><path d="M672.00,243.00 L666.80,246.00 L666.80,240.00 Z" fill="#66707C"/><path d="M796.0,276 C796.0,328 204.0,328 204.0,276" fill="none" stroke="#6B5495" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5"/><text x="500.00" y="324.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:500;fill:#6B5495">verify — re-render and compare bytes</text><rect x="30.00" y="372.00" width="300.00" height="92.00" rx="10" fill="#E7F0F2" stroke="none" stroke-width="1.2"/><g fill="none" stroke="#1F6F8B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="56.00" y1="394.00" x2="54.00" y2="410.00"/><line x1="64.00" y1="394.00" x2="62.00" y2="410.00"/><line x1="52.00" y1="399.00" x2="68.00" y2="399.00"/><line x1="52.00" y1="405.00" x2="68.00" y2="405.00"/></g><text x="84.00" y="406.00" text-anchor="start" style="font-family:Fira Sans;font-size:14.5px;font-weight:600;fill:#171B22">Deterministic</text><text x="48.00" y="430.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.4px;font-weight:400;fill:#3C444F">same source, same engine → the same bytes, forever.</text>
<text x="48.00" y="444.77" text-anchor="start" style="font-family:Fira Sans;font-size:10.4px;font-weight:400;fill:#3C444F">Entropy is seeded from the contract hash.</text><rect x="350.00" y="372.00" width="300.00" height="92.00" rx="10" fill="#F6EBD8" stroke="none" stroke-width="1.2"/><g fill="none" stroke="#C6852F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M372.00,402.00 Q380.00,394.50 388.00,402.00 Q380.00,409.50 372.00,402.00 Z"/><circle cx="380.00" cy="402.00" r="2.60" fill="none"/></g><text x="404.00" y="406.00" text-anchor="start" style="font-family:Fira Sans;font-size:14.5px;font-weight:600;fill:#171B22">Inspectable</text><text x="368.00" y="430.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.4px;font-weight:400;fill:#3C444F">intent expands into explicit data anyone — or any agent</text>
<text x="368.00" y="444.77" text-anchor="start" style="font-family:Fira Sans;font-size:10.4px;font-weight:400;fill:#3C444F">— can read, diff, and trust before it plays.</text><rect x="670.00" y="372.00" width="300.00" height="92.00" rx="10" fill="#ECE6F2" stroke="none" stroke-width="1.2"/><g fill="none" stroke="#6B5495" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M700.00,393.00 L708.00,397.50 L708.00,406.50 L700.00,411.00 L692.00,406.50 L692.00,397.50 Z"/><circle cx="700.00" cy="402.00" r="2.60" fill="none"/></g><text x="724.00" y="406.00" text-anchor="start" style="font-family:Fira Sans;font-size:14.5px;font-weight:600;fill:#171B22">Agent-native</text><text x="688.00" y="430.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.4px;font-weight:400;fill:#3C444F">authored and mutated through a structured contract,</text>
<text x="688.00" y="444.77" text-anchor="start" style="font-family:Fira Sans;font-size:10.4px;font-weight:400;fill:#3C444F">with no UI standing between intent and output.</text><text x="36.00" y="486.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:600;fill:#66707C;letter-spacing:1.5px">BUILT FOR</text><rect x="128.00" y="471.00" width="112.13" height="24.00" rx="12.0" fill="#F4F1EA" stroke="none" stroke-width="1.0"/><text x="184.07" y="486.68" text-anchor="middle" style="font-family:Fira Sans;font-size:10.5px;font-weight:500;fill:#3C444F">Production teams</text><rect x="252.13" y="471.00" width="116.79" height="24.00" rx="12.0" fill="#F4F1EA" stroke="none" stroke-width="1.0"/><text x="310.53" y="486.68" text-anchor="middle" style="font-family:Fira Sans;font-size:10.5px;font-weight:500;fill:#3C444F">Pipeline engineers</text><rect x="380.92" y="471.00" width="149.65" height="24.00" rx="12.0" fill="#F4F1EA" stroke="none" stroke-width="1.0"/><text x="455.75" y="486.68" text-anchor="middle" style="font-family:Fira Sans;font-size:10.5px;font-weight:500;fill:#3C444F">AI agents &amp; their builders</text><line x1="36.00" y1="495.00" x2="964.00" y2="495.00" stroke="#DED9CE" stroke-width="1.0" stroke-linecap="butt"/><text x="36.00" y="515.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">AudioForge treats a finished sound as a build artifact: an inspectable source compiles to a hashed contract that renders to byte-identical audio, authored as</text>
<text x="36.00" y="534.50" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">readily by an AI agent as by a person, and verifiable the way code is.</text></svg>