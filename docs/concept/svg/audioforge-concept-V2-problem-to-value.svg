<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect x="0.00" y="0.00" width="1000.00" height="560.00" rx="0" fill="#FCFBF8" stroke="none" stroke-width="1.0"/><rect x="0.00" y="0.00" width="1000.00" height="560.00" rx="14" fill="none" stroke="#DED9CE" stroke-width="1.4"/><rect x="36.00" y="40.00" width="32.95" height="24.00" rx="6" fill="#1F6F8B" stroke="none" stroke-width="1.0"/><text x="52.48" y="56.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#FCFBF8;letter-spacing:1px">V2</text><text x="84.95" y="52.00" text-anchor="start" style="font-family:Fira Sans;font-size:22px;font-weight:600;fill:#171B22">From broken promise to build artifact</text><text x="84.95" y="72.00" text-anchor="start" style="font-family:Fira Sans;font-size:12.5px;font-weight:400;fill:#66707C">Each failure of today&#x27;s workflow, and the mechanism that resolves it into value</text><line x1="36.00" y1="88.00" x2="964.00" y2="88.00" stroke="#DED9CE" stroke-width="1.2" stroke-linecap="butt"/><rect x="36.00" y="108.00" width="292.00" height="22.00" rx="0" fill="none" stroke="none" stroke-width="1.0"/><text x="36.00" y="122.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.5px;font-weight:700;fill:#AF4E3C;letter-spacing:1.2px">THE PROBLEM</text><rect x="354.00" y="108.00" width="292.00" height="22.00" rx="0" fill="none" stroke="none" stroke-width="1.0"/><text x="354.00" y="122.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.5px;font-weight:700;fill:#1F6F8B;letter-spacing:1.2px">THE MECHANISM</text><rect x="672.00" y="108.00" width="292.00" height="22.00" rx="0" fill="none" stroke="none" stroke-width="1.0"/><text x="672.00" y="122.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.5px;font-weight:700;fill:#2E8B72;letter-spacing:1.2px">THE VALUE</text><rect x="36.00" y="142.00" width="292.00" height="70.00" rx="8" fill="#FCFBF8" stroke="#DED9CE" stroke-width="1.2"/><path d="M44,142 h0 a8,8 0 0 0 -8,8 v54 a8,8 0 0 0 8,8" fill="none" stroke="#AF4E3C" stroke-width="2.6"/><rect x="36.00" y="150.00" width="2.60" height="54.00" rx="0" fill="#AF4E3C" stroke="none" stroke-width="1.0"/><rect x="354.00" y="142.00" width="292.00" height="70.00" rx="8" fill="#E7F0F2" stroke="none" stroke-width="1.2"/><rect x="672.00" y="142.00" width="292.00" height="70.00" rx="8" fill="#E2F0EA" stroke="none" stroke-width="1.2"/><text x="51.00" y="166.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#3C444F">Sessions no one can repeat; hidden plugin and tool</text>
<text x="51.00" y="181.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#3C444F">state.</text><text x="369.00" y="166.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">The IR is truth — intent compiles to explicit, diffable</text>
<text x="369.00" y="181.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">data.</text><text x="687.00" y="166.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">Every render reproducible and reviewable from its</text>
<text x="687.00" y="181.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">source.</text><line x1="331.00" y1="177.00" x2="346.00" y2="177.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M351.00,177.00 L346.67,179.50 L346.67,174.50 Z" fill="#98A0AB"/><line x1="649.00" y1="177.00" x2="664.00" y2="177.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M669.00,177.00 L664.67,179.50 L664.67,174.50 Z" fill="#98A0AB"/><rect x="36.00" y="226.00" width="292.00" height="70.00" rx="8" fill="#FCFBF8" stroke="#DED9CE" stroke-width="1.2"/><path d="M44,226 h0 a8,8 0 0 0 -8,8 v54 a8,8 0 0 0 8,8" fill="none" stroke="#AF4E3C" stroke-width="2.6"/><rect x="36.00" y="234.00" width="2.60" height="54.00" rx="0" fill="#AF4E3C" stroke="none" stroke-width="1.0"/><rect x="354.00" y="226.00" width="292.00" height="70.00" rx="8" fill="#E7F0F2" stroke="none" stroke-width="1.2"/><rect x="672.00" y="226.00" width="292.00" height="70.00" rx="8" fill="#E2F0EA" stroke="none" stroke-width="1.2"/><text x="51.00" y="250.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#3C444F">Randomness leaks from clocks and global RNG.</text><text x="369.00" y="250.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">All entropy is seeded from the contract hash.</text><text x="687.00" y="250.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">Declared, traceable variation instead of accidental</text>
<text x="687.00" y="265.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">drift.</text><line x1="331.00" y1="261.00" x2="346.00" y2="261.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M351.00,261.00 L346.67,263.50 L346.67,258.50 Z" fill="#98A0AB"/><line x1="649.00" y1="261.00" x2="664.00" y2="261.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M669.00,261.00 L664.67,263.50 L664.67,258.50 Z" fill="#98A0AB"/><rect x="36.00" y="310.00" width="292.00" height="70.00" rx="8" fill="#FCFBF8" stroke="#DED9CE" stroke-width="1.2"/><path d="M44,310 h0 a8,8 0 0 0 -8,8 v54 a8,8 0 0 0 8,8" fill="none" stroke="#AF4E3C" stroke-width="2.6"/><rect x="36.00" y="318.00" width="2.60" height="54.00" rx="0" fill="#AF4E3C" stroke="none" stroke-width="1.0"/><rect x="354.00" y="310.00" width="292.00" height="70.00" rx="8" fill="#E7F0F2" stroke="none" stroke-width="1.2"/><rect x="672.00" y="310.00" width="292.00" height="70.00" rx="8" fill="#E2F0EA" stroke="none" stroke-width="1.2"/><text x="51.00" y="334.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#3C444F">“What changed, and does it still match intent?” goes</text>
<text x="51.00" y="349.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#3C444F">unanswered.</text><text x="369.00" y="334.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">A manifest records the spec hash and output</text>
<text x="369.00" y="349.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">checksum.</text><text x="687.00" y="334.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">Diffable provenance; drift caught by a byte-compare</text>
<text x="687.00" y="349.05" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">gate.</text><line x1="331.00" y1="345.00" x2="346.00" y2="345.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M351.00,345.00 L346.67,347.50 L346.67,342.50 Z" fill="#98A0AB"/><line x1="649.00" y1="345.00" x2="664.00" y2="345.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M669.00,345.00 L664.67,347.50 L664.67,342.50 Z" fill="#98A0AB"/><rect x="36.00" y="394.00" width="292.00" height="70.00" rx="8" fill="#FCFBF8" stroke="#DED9CE" stroke-width="1.2"/><path d="M44,394 h0 a8,8 0 0 0 -8,8 v54 a8,8 0 0 0 8,8" fill="none" stroke="#AF4E3C" stroke-width="2.6"/><rect x="36.00" y="402.00" width="2.60" height="54.00" rx="0" fill="#AF4E3C" stroke="none" stroke-width="1.0"/><rect x="354.00" y="394.00" width="292.00" height="70.00" rx="8" fill="#E7F0F2" stroke="none" stroke-width="1.2"/><rect x="672.00" y="394.00" width="292.00" height="70.00" rx="8" fill="#E2F0EA" stroke="none" stroke-width="1.2"/><text x="51.00" y="418.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#3C444F">Agents emit opaque blobs no pipeline can check.</text><text x="369.00" y="418.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">Validation binds resources: valid means render-ready.</text><text x="687.00" y="418.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.6px;font-weight:400;fill:#171B22">Agent output is verified before it enters production.</text><line x1="331.00" y1="429.00" x2="346.00" y2="429.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M351.00,429.00 L346.67,431.50 L346.67,426.50 Z" fill="#98A0AB"/><line x1="649.00" y1="429.00" x2="664.00" y2="429.00" stroke="#98A0AB" stroke-width="1.4" stroke-linecap="butt"/><path d="M669.00,429.00 L664.67,431.50 L664.67,426.50 Z" fill="#98A0AB"/><line x1="36.00" y1="495.00" x2="964.00" y2="495.00" stroke="#DED9CE" stroke-width="1.0" stroke-linecap="butt"/><text x="36.00" y="515.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">The through-line: opacity becomes an inspectable contract, leaked randomness becomes seeded lineage, and unverifiable output becomes a gate — turning</text>
<text x="36.00" y="534.50" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">fragile sessions into trustworthy deliveries.</text></svg>