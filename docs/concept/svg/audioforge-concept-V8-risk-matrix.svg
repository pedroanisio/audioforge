<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="578" viewBox="0 0 1000 578"><rect x="0.00" y="0.00" width="1000.00" height="578.00" rx="0" fill="#FCFBF8" stroke="none" stroke-width="1.0"/><rect x="0.00" y="0.00" width="1000.00" height="578.00" rx="14" fill="none" stroke="#DED9CE" stroke-width="1.4"/><rect x="36.00" y="40.00" width="33.55" height="24.00" rx="6" fill="#1F6F8B" stroke="none" stroke-width="1.0"/><text x="52.77" y="56.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#FCFBF8;letter-spacing:1px">V8</text><text x="85.55" y="52.00" text-anchor="start" style="font-family:Fira Sans;font-size:22px;font-weight:600;fill:#171B22">Honest boundaries, and how each is held</text><text x="85.55" y="72.00" text-anchor="start" style="font-family:Fira Sans;font-size:12.5px;font-weight:400;fill:#66707C">The constraints that shape the system — and the deliberate response to each</text><line x1="36.00" y1="88.00" x2="964.00" y2="88.00" stroke="#DED9CE" stroke-width="1.2" stroke-linecap="butt"/><text x="36.00" y="124.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:700;fill:#66707C;letter-spacing:1px">CONSTRAINT</text><text x="312.00" y="124.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:700;fill:#66707C;letter-spacing:1px">THE LIMIT</text><text x="550.00" y="124.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:700;fill:#66707C;letter-spacing:1px">HOW IT&#x27;S HELD</text><rect x="36.00" y="132.00" width="928.00" height="54.00" rx="7" fill="#F4F1EA" stroke="none" stroke-width="1.0" opacity="0.55"/><rect x="40.00" y="144.00" width="3.00" height="30.00" rx="1.5" fill="#6B5495" stroke="none" stroke-width="1.0"/><text x="54.00" y="156.00" text-anchor="start" style="font-family:Fira Sans;font-size:11.4px;font-weight:600;fill:#171B22">Cross-platform float identity</text><text x="312.00" y="154.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">reproducibility can vary by environment</text><text x="550.00" y="154.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#171B22">the verify gate proves identity per environment, rather than assuming it</text><line x1="36.00" y1="186.00" x2="964.00" y2="186.00" stroke="#DED9CE" stroke-width="0.8" stroke-linecap="butt"/><rect x="40.00" y="206.00" width="3.00" height="30.00" rx="1.5" fill="#1F6F8B" stroke="none" stroke-width="1.0"/><text x="54.00" y="218.00" text-anchor="start" style="font-family:Fira Sans;font-size:11.4px;font-weight:600;fill:#171B22">Loudness &amp; limiting</text><text x="312.00" y="216.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">production-consistent, not a certified meter</text><text x="550.00" y="216.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#171B22">manifests record measured values for reference against compliant meters</text><line x1="36.00" y1="248.00" x2="964.00" y2="248.00" stroke="#DED9CE" stroke-width="0.8" stroke-linecap="butt"/><rect x="36.00" y="256.00" width="928.00" height="54.00" rx="7" fill="#F4F1EA" stroke="none" stroke-width="1.0" opacity="0.55"/><rect x="40.00" y="268.00" width="3.00" height="30.00" rx="1.5" fill="#AF4E3C" stroke="none" stroke-width="1.0"/><text x="54.00" y="280.00" text-anchor="start" style="font-family:Fira Sans;font-size:11.4px;font-weight:600;fill:#171B22">Finite sampled sustains</text><text x="312.00" y="278.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">held notes can outrun a non-looping sample</text><text x="550.00" y="278.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#171B22">the plan detects the gap and warns or refuses, per policy</text><line x1="36.00" y1="310.00" x2="964.00" y2="310.00" stroke="#DED9CE" stroke-width="0.8" stroke-linecap="butt"/><rect x="40.00" y="330.00" width="3.00" height="30.00" rx="1.5" fill="#AF4E3C" stroke="none" stroke-width="1.0"/><text x="54.00" y="342.00" text-anchor="start" style="font-family:Fira Sans;font-size:11.4px;font-weight:600;fill:#171B22">Native DSP kernels</text><text x="312.00" y="340.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">some voices/effects need a compiler</text><text x="550.00" y="340.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#171B22">they fail loud — never a silent substitution of different audio</text><line x1="36.00" y1="372.00" x2="964.00" y2="372.00" stroke="#DED9CE" stroke-width="0.8" stroke-linecap="butt"/><rect x="36.00" y="380.00" width="928.00" height="54.00" rx="7" fill="#F4F1EA" stroke="none" stroke-width="1.0" opacity="0.55"/><rect x="40.00" y="392.00" width="3.00" height="30.00" rx="1.5" fill="#C6852F" stroke="none" stroke-width="1.0"/><text x="54.00" y="404.00" text-anchor="start" style="font-family:Fira Sans;font-size:11.4px;font-weight:600;fill:#171B22">Lossy delivery (MP3)</text><text x="312.00" y="402.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">sits outside the byte-hash guarantee</text><text x="550.00" y="402.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#171B22">provenance is carried in the file&#x27;s metadata instead</text><line x1="36.00" y1="434.00" x2="964.00" y2="434.00" stroke="#DED9CE" stroke-width="0.8" stroke-linecap="butt"/><rect x="40.00" y="454.00" width="3.00" height="30.00" rx="1.5" fill="#66707C" stroke="none" stroke-width="1.0"/><text x="54.00" y="466.00" text-anchor="start" style="font-family:Fira Sans;font-size:11.4px;font-weight:600;fill:#171B22">Non-vocal scope</text><text x="312.00" y="464.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">voice and lyrics are out of scope</text><text x="550.00" y="464.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#171B22">a deliberate boundary — depth of craft over breadth of surface</text><line x1="36.00" y1="496.00" x2="964.00" y2="496.00" stroke="#DED9CE" stroke-width="0.8" stroke-linecap="butt"/><line x1="36.00" y1="513.00" x2="964.00" y2="513.00" stroke="#DED9CE" stroke-width="1.0" stroke-linecap="butt"/><text x="36.00" y="533.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">None of these are hidden. Each limit is met by making the boundary explicit and auditable rather than papering over it — the same loud-failure stance the</text>
<text x="36.00" y="552.50" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">whole system is built on.</text></svg>