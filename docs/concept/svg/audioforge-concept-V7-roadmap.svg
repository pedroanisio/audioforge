eterministic kernels; content-addressed stores; policy-gated plan; manifest-driven provenance.</text><line x1="36.00" y1="535.00" x2="964.00" y2="535.00" stroke="#DED9CE" stroke-width="1.0" stroke-linecap="butt"/><text x="36.00" y="555.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">The contract, determinism and the render-ready gate come first because everything later leans on them. Each phase ships whole and stays reproducible;</text>
