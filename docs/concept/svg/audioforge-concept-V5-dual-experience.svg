<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect x="0.00" y="0.00" width="1000.00" height="600.00" rx="0" fill="#FCFBF8" stroke="none" stroke-width="1.0"/><rect x="0.00" y="0.00" width="1000.00" height="600.00" rx="14" fill="none" stroke="#DED9CE" stroke-width="1.4"/><rect x="36.00" y="40.00" width="33.05" height="24.00" rx="6" fill="#1F6F8B" stroke="none" stroke-width="1.0"/><text x="52.52" y="56.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#FCFBF8;letter-spacing:1px">V5</text><text x="85.05" y="52.00" text-anchor="start" style="font-family:Fira Sans;font-size:22px;font-weight:600;fill:#171B22">Two hands on the same contract</text><text x="85.05" y="72.00" text-anchor="start" style="font-family:Fira Sans;font-size:12.5px;font-weight:400;fill:#66707C">How an AI agent and a human operator each work the system</text><line x1="36.00" y1="88.00" x2="964.00" y2="88.00" stroke="#DED9CE" stroke-width="1.2" stroke-linecap="butt"/><rect x="36.00" y="104.00" width="430.00" height="400.00" rx="12" fill="#ECE6F2" stroke="none" stroke-width="1.2"/><rect x="534.00" y="104.00" width="430.00" height="400.00" rx="12" fill="#F6EBD8" stroke="none" stroke-width="1.2"/><g fill="none" stroke="#6B5495" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M71.00,125.25 L79.67,130.12 L79.67,139.88 L71.00,144.75 L62.33,139.88 L62.33,130.12 Z"/><circle cx="71.00" cy="135.00" r="2.82" fill="none"/></g><text x="94.00" y="134.00" text-anchor="start" style="font-family:Fira Sans;font-size:12px;font-weight:700;fill:#6B5495;letter-spacing:1px">THE AI AGENT</text><text x="94.00" y="150.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">authors and repairs without a screen</text><g fill="none" stroke="#C6852F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="569.00" cy="130.67" r="3.68" fill="none"/><path d="M561.42,143.67 L561.42,140.96 L563.58,138.79 L574.42,138.79 L576.58,140.96 L576.58,143.67"/></g><text x="592.00" y="134.00" text-anchor="start" style="font-family:Fira Sans;font-size:12px;font-weight:700;fill:#9A6A1E;letter-spacing:1px">THE HUMAN OPERATOR</text><text x="592.00" y="150.00" text-anchor="start" style="font-family:Fira Sans;font-size:10px;font-weight:400;fill:#3C444F">directs intent and holds the gates</text><circle cx="66.00" cy="188.00" r="12.00" fill="#FCFBF8" stroke="#6B5495" stroke-width="1.6"/><text x="66.00" y="192.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#6B5495">1</text><text x="88.00" y="186.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:600;fill:#171B22">Perceive</text><text x="88.00" y="203.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">reads the IR, the capability manifest, structured line-cited diagnostics, and</text>
<text x="88.00" y="217.48" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">the render plan&#x27;s evidence.</text><line x1="66.00" y1="202.00" x2="66.00" y2="242.00" stroke="#6B5495" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="2 4"/><circle cx="66.00" cy="266.00" r="12.00" fill="#FCFBF8" stroke="#6B5495" stroke-width="1.6"/><text x="66.00" y="270.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#6B5495">2</text><text x="88.00" y="264.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:600;fill:#171B22">Act</text><text x="88.00" y="281.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">emits or mutates the contract; schema-checked edits never raise — every</text>
<text x="88.00" y="295.48" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">problem returns as structured feedback.</text><line x1="66.00" y1="280.00" x2="66.00" y2="320.00" stroke="#6B5495" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="2 4"/><circle cx="66.00" cy="344.00" r="12.00" fill="#FCFBF8" stroke="#6B5495" stroke-width="1.6"/><text x="66.00" y="348.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#6B5495">3</text><text x="88.00" y="342.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:600;fill:#171B22">Verify</text><text x="88.00" y="359.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">treats its own output as untrusted; “valid” is a true predicate for “will</text>
<text x="88.00" y="373.48" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">render”.</text><circle cx="564.00" cy="188.00" r="12.00" fill="#FCFBF8" stroke="#C6852F" stroke-width="1.6"/><text x="564.00" y="192.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#C6852F">1</text><text x="586.00" y="186.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:600;fill:#171B22">Direct</text><text x="586.00" y="203.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">writes austere intent — emotion, intensity, motifs, style — that expands into</text>
<text x="586.00" y="217.48" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">explicit, reviewable IR.</text><line x1="564.00" y1="202.00" x2="564.00" y2="242.00" stroke="#C6852F" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="2 4"/><circle cx="564.00" cy="266.00" r="12.00" fill="#FCFBF8" stroke="#C6852F" stroke-width="1.6"/><text x="564.00" y="270.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#C6852F">2</text><text x="586.00" y="264.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:600;fill:#171B22">Oversee</text><text x="586.00" y="281.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">reads manifests, markers and loudness reports; diffs two renders; gates drift</text>
<text x="586.00" y="295.48" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">in CI.</text><line x1="564.00" y1="280.00" x2="564.00" y2="320.00" stroke="#C6852F" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="2 4"/><circle cx="564.00" cy="344.00" r="12.00" fill="#FCFBF8" stroke="#C6852F" stroke-width="1.6"/><text x="564.00" y="348.00" text-anchor="middle" style="font-family:Fira Sans;font-size:11px;font-weight:700;fill:#C6852F">3</text><text x="586.00" y="342.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:600;fill:#171B22">Deliver</text><text x="586.00" y="359.00" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">renders presets, campaigns and variants, then packages tagged</text>
<text x="586.00" y="373.48" text-anchor="start" style="font-family:Fira Sans;font-size:10.2px;font-weight:400;fill:#3C444F">distributables with provenance intact.</text><text x="500.00" y="476.00" text-anchor="middle" style="font-family:Fira Sans;font-size:9.5px;font-weight:500;fill:#66707C">both resolve to →</text><rect x="426.36" y="484.00" width="147.27" height="24.00" rx="12.0" fill="#1F6F8B" stroke="none" stroke-width="1.0"/><text x="500.00" y="499.68" text-anchor="middle" style="font-family:Fira Sans;font-size:10.5px;font-weight:600;fill:#FCFBF8">the IR + verification layer</text><line x1="36.00" y1="535.00" x2="964.00" y2="535.00" stroke="#DED9CE" stroke-width="1.0" stroke-linecap="butt"/><text x="36.00" y="555.00" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">Both meet at the IR and its verification layer. The agent reads and writes the contract directly; the operator shapes intent and holds the gates — neither</text>
<text x="36.00" y="574.50" text-anchor="start" style="font-family:Fira Sans;font-size:13px;font-weight:400;fill:#66707C;font-style:italic">depends on a UI to absorb ambiguity.</text></svg>