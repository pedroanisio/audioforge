# =====================================================================
# Backlog - canonical deferred-work registry
#
# System of record for deferred features, tech debt, known bugs, research,
# and infrastructure work. Structure is defined by
# docs/schema/backlog.schema.json. Validate with:
#   node scripts/check-backlog-governance.mjs
#
# Rules:
# - no time estimates; effort is complexity only
# - every item traces to a real source
# - ownership records the provenance boundary for concurrent work
# - status claims, especially done, must remain backed by live evidence
# =====================================================================

