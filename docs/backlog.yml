  - id: BL-028
    title: "General sieve engine (residual-class sieves for scales and rhythm)"
    summary: "A sieve primitive that generates pitch-class sets and rhythm patterns from unions and intersections of residual classes, with the current Euclidean rhythm as one special case."
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "M"
    priority: "medium"
    rationale: "The engine expresses sieves only as Euclidean rhythm (theory.py bjorklund), which is one degenerate case of Xenakis sieve theory. Sieves unify scale and rhythm as logical, mechanizable functions over residual classes, and over the tempered chromatic (mod 12) they need no new tuning support, so this is the most architecture-aligned formal primitive the engine lacks."
    acceptance_criteria:
      - "A sieve expression produces both a pitch-class set (mod 12) and a rhythm pattern from residual-class logic."
      - "euclid is expressible as, or reduces to, a sieve, and renders byte-identically to the current output."
      - "Sieve output is explicit in the compiled IR and covered by the golden-audio gate."
    references:
      - "docs/ROADMAP.md"
      - "audioforge/theory.py"
      - "audioforge/dsl.py"
    owner: "unassigned"
    source: "Deep-dive of the codebase against the formalized-music corpus; Xenakis sieve theory (corpus document 48190286-Xenakis-Formalized-Music), sieve theory over the tempered chromatic scale."
    tags:
      - "AF-X01"
      - "sieve"
      - "algorithmic"
      - "xenakis"
  - id: BL-029
    title: "Seeded stochastic composition primitives"
    summary: "Probability distributions, Markov chains, and bounded random walks that expand into explicit IR note and rhythm events at compile time, reproducible from the spec seed."
    category: "feature"
    type: "feature"
    status: "ready"
    complexity: "L"
    priority: "high"
    rationale: "The corpus's computer-music core is stochastic composition, yet the engine exposes no compositional stochastic primitives; np.random is used only for DSP noise and dither. The seeded-determinism substrate already roots every random path in the spec hash, which is exactly the machinery to make stochastic composition reproducible, a differentiated niche the substrate was built for."
    acceptance_criteria:
      - "Distribution, Markov, and random-walk generators expand to explicit IR events at compile time, leaving the IR the complete ground truth."
      - "The same spec and variant tag render byte-identically; a new variant re-realizes the seeded choices coherently."
      - "The primitives land behind the golden-audio gate and are documented in the DSL spec and capability manifest."
    references:
      - "docs/ROADMAP.md"
      - "audioforge/determinism.py"
      - "audioforge/compose.py"
    owner: "unassigned"
    source: "Deep-dive of the codebase against the formalized-music corpus; Xenakis free and Markovian stochastic music (corpus document 48190286-Xenakis-Formalized-Music)."
    tags:
      - "AF-X02"
      - "stochastic"
      - "algorithmic"
      - "determinism"
