    rationale: "The engine expresses sieves only as Euclidean rhythm (theory.py bjorklund), which is one degenerate case of Xenakis sieve theory. Sieves unify scale and rhythm as logical, mechanizable functions over residual classes, and over the tempered chromatic (mod 12) they need no new tuning support, so this is the most architecture-aligned formal primitive the engine lacks."
    acceptance_criteria:
      - "A sieve expression produces both a pitch-class set (mod 12) and a rhythm pattern from residual-class logic."
      - "euclid is expressible as, or reduces to, a sieve, and renders byte-identically to the current output."
