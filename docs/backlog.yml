  - id: BL-031
    title: "Positioning decision: deterministic ground truth under generative music AI"
    summary: "An architecture decision record fixing whether the engine positions as the verifiable ground-truth and render layer beneath generative music AI, rather than adding generation itself."
    category: "docs"
    type: "research"
    status: "ready"
    complexity: "XS"
    priority: "low"
    rationale: "The corpus frames the frontier as learning-based generation, while the engine is a deterministic renderer and verifier whose operating law treats model output as untrusted. Without a recorded stance, product direction between building generation and being the verification substrate drifts."
    acceptance_criteria:
      - "An ADR under docs/adr records the decision, alternatives, and consequences."
      - "The decision is consistent with PURPOSE.md and the untrusted-output law in CLAUDE.md."
      - "The ADR is referenced from the roadmap so downstream items inherit the stance."
    references:
      - "docs/ROADMAP.md"
      - "PURPOSE.md"
      - "CLAUDE.md"
    owner: "unassigned"
    source: "Deep-dive open question: the corpus survey Mathematical Music: From Antiquity to Music AI frames a frontier the engine deliberately does not occupy."
    tags:
      - "AF-X04"
      - "positioning"
      - "adr"
      - "music-ai"
